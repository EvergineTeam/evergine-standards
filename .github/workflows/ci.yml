# Main CI workflow for evergine-standards repository
# Runs comprehensive tests for sync-standards.ps1 script

name: CI

on:
  push:
    branches:
      - main
      - v*
  pull_request:
    branches:
      - main
      - v*
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/_test-sync-standards.yml